name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;23.2.8568313" "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Download Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cd ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* .

      - name: Set up Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $HOME/mygame.keystore
          # Patch export_presets.cfg with correct runner keystore path
          sed -i "s|keystore/release=".*"|keystore/release="$HOME/mygame.keystore"|" export_presets.cfg
          sed -i "s|keystore/release_user=".*"|keystore/release_user="mygame"|" export_presets.cfg
          sed -i "s|keystore/release_password=".*"|keystore/release_password="${{ secrets.KEYSTORE_PASSWORD }}"|" export_presets.cfg

      - name: Configure Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << 'SETTINGS'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          SETTINGS

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --editor --quit || true
          godot --headless --export-release "Android" build/nightfall.apk
        env:
          GODOT_SILENCE_ROOT_WARNING: 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-apk
          path: build/nightfall.apk

      - name: Commit APK to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          sed -i '/^build//d' .gitignore || true
          git add build/nightfall.apk || true
          git diff --staged --quiet || git commit -m "ci: APK build $(date '+%Y-%m-%d %H:%M')"
          git push
